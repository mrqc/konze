konze:
  databaseContextId: sample-context
  profiles:
    example-profile:
      permissions:
        - select
        - insert
        - update
        - delete
        - truncate
        - references
        - trigger
        - maintain
        - usage
        - create
        - connect
        - temporary
        - execute
        - all privileges
        
      configuration:
        query:
          executionTimeout: 60s
          executionLogging: true
          executionLog: ./logs/execution.log
        monitoring:
          slowQueryThreshold: 500
          slowQueryLogging: true
          slowQueryLog: ./logs/slow-queries.log
      schemaDiscoveryEndpoint:
        enabled: true
        endpoint: /schema-discovery
        rateLimiting: 100
      pool:
        dataSourceClassName: com.zaxxer.hikari.HikariDataSource
        jdbcUrl: jdbc:postgresql://localhost:5432/konze_db
        autoCommit: true
        connectionTimeout: 30000
        idleTimeout: 600000
        keepaliveTime: 0
        maxLifetime: 1800000
        connectionTestQuery: select 1
        minimumIdle: 10
        maximumPoolSize: 20
        poolName: MyHikariPool
        initializationFailTimeout: 1
        readOnly: false
        connectionInitSql: select 1
        transactionIsolation: TRANSACTION_READ_COMMITTED
        validationTimeout: 5000
        leakDetectionThreshold: 2000
        schema: public
        
  databaseAdministration:
    access:
      driver: net.masterstudios.konze.driver.postgres.PostgresDatabaseDriver
      schemaDiscovery: net.masterstudios.konze.discovery.postgres.PostgresSchemaDiscovery
      jdbcUrl: jdbc:postgresql://localhost:5432/konze_db
      username: konze_user
      password: konze_password
    schema:
      updateTrigger: true #tbi
      deleteTrigger: true #tbi
      insertTrigger: true #tbi
