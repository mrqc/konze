konze:
  # This path is relative to the working directory when running the app
  config-files:
    - "example-spring-boot-app/src/main/resources/example-spec.yaml"

spring:
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
