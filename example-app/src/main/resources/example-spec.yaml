konze:
  databaseContextId: sample-context
  profiles:
    full-access-profile:
      permissions:
        - select
        - insert
        - update
        - delete
        - truncate
        - references
        - trigger
        - maintain
        - usage
        - create
        - connect
        - temporary
        - execute
        
      configuration:
        query:
          executionTimeout: 60s
          executionLogging: true
          executionLog: ./logs/execution.log
        monitoring:
          slowQueryThreshold: 500
          slowQueryLogging: true
          slowQueryLog: ./logs/slow-queries.log
      schemaDiscoveryEndpoint:
        enabled: true
        endpoint: /schema-discovery
        rateLimiting: 100
      pool:
        jdbcUrl: jdbc:postgresql://localhost:5432/konze_db
        username: full-access-user
        password: konze_password
        autoCommit: true
        connectionTimeout: 30000
        idleTimeout: 600000
        keepaliveTime: 0
        maxLifetime: 1800000
        connectionTestQuery: select 1
        minimumIdle: 5
        maximumPoolSize: 10
        poolName: ExamplePool
        initializationFailTimeout: -1
        readOnly: false
        validationTimeout: 5000
        leakDetectionThreshold: 3000

    read-only-profile:
      permissions:
        - select
      pool:
        jdbcUrl: jdbc:postgresql://localhost:5432/konze_db

    write-only-profile:
      permissions:
        - insert
      pool:
        jdbcUrl: jdbc:postgresql://localhost:5432/konze_db
        
  databaseAdministration:
    access:
      driver: net.masterstudios.konze.driver.postgres.PostgresDatabaseDriver
      jdbcUrl: jdbc:postgresql://localhost:5432/konze_db
      username: konze_user
      password: konze_password
    schema:
      updateTrigger: true
      deleteTrigger: true
      insertTrigger: true
